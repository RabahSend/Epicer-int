services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epicerint
      POSTGRES_USER: epicerint
      POSTGRES_PASSWORD: epicerint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epicerint -d epicerint"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    expose:
      - "8000"
    volumes:
      - ./epicerIntApp:/app:z
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: epicerint
      POSTGRES_USER: epicerint
      POSTGRES_PASSWORD: epicerint
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@epicerint.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-projetinfo1A}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - web

volumes:
  postgres_data:
