{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Épicer'INT{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/css/layout.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'home' %}">Épicer'INT</a>

        <button
            type="button"
            class="nav-toggle"
            data-nav-toggle
            aria-controls="site-nav"
            aria-expanded="false"
            >
            Menu
        </button>

      <nav id="site-nav" class="site-nav" aria-label="Navigation principale">
        <a href="{% url 'home' %}">Accueil</a>
        <a href="{% url 'products' %}">Produits</a>
        {% if user.is_authenticated %}
          <a href="{% url 'orders' %}">Commandes</a>
          <a href="#">Notifications</a>
          <a href="{% url 'profile' %}">Mon compte</a>
          {% if user.is_staff %}
            <a href="{% url 'admin:index' %}">Administration</a>
          {% endif %}
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Déconnexion</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Connexion</a>
          <a href="{% url 'signup' %}">Inscription</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'core/js/nav.js' %}"></script>
</body>
</html>
