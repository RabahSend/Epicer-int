name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epicerint
          POSTGRES_USER: epicerint
          POSTGRES_PASSWORD: epicerint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epicerint -d epicerint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: epicerIntApp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: epicerIntApp
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: epicerint
          POSTGRES_USER: epicerint
          POSTGRES_PASSWORD: epicerint